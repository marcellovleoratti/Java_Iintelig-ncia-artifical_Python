server.port=8080
# Faixa monitorada (EUR, inclusiva)
aml.band.min=3000
aml.band.max=10000
# Score a partir do qual o cliente é sinalizado para revisão
aml.flag-threshold=50
# IA (opcional): defina ANTHROPIC_API_KEY no ambiente. Sem chave, usa só as regras.
aml.ai.model=claude-sonnet-5-5
aml.ai.api-key=${ANTHROPIC_API_KEY:}
